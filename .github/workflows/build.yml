          cat > README.md << 'EOF_RM'
          # CrashForge
          3D soft-body vehicle destruction. C++20 + raylib. Android APK built by GitHub Actions.
          Source: src/main.cpp. Build: see .github/workflows/build.yml
          EOF_RM

      - name: Commit generated sources
        run: |
          git config user.name "crashforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate CrashForge sources [skip ci]"
          git push || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK NDK CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/CrashForge.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CrashForge-apk
          path: out/CrashForge.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CrashForge build ${{ github.run_number }}
          files: out/CrashForge.apk
          body: |
            Android 7+ arm64. Скачай CrashForge.apk и открой файл на телефоне.

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: dep
        uses: actions/deploy-pages@v4