          document.getElementById('nl').href='https://nightly.link/'+owner+'/'+repo+'/workflows/build/main/CrashForge-apk.zip';
          fetch('https://api.github.com/repos/'+owner+'/'+repo+'/releases/latest')
          .then(r=>r.ok?r.json():Promise.reject()).then(j=>{
          const a=(j.assets||[]).find(x=>x.name.endsWith('.apk'));
          if(!a)throw 0;
          dl.href=a.browser_download_url;
          st.textContent=j.tag_name+' - '+(a.size/1048576).toFixed(1)+' МБ';
          }).catch(()=>{dl.href='https://github.com/'+owner+'/'+repo+'/releases';
          st.textContent='Релиз ещё готовится - обнови страницу через минуту';});
          </script></body></html>
