          <div class="card"><h3>Честные шины</h3><p>Модель Pacejka: продольное скольжение, угол увода, эллипс трения. Юз, дрифт, следы на асфальте.</p></div>
          <div class="card"><h3>5 режимов</h3><p>Песочница, краш-тест в стену, трамплин, дерби с ИИ, гидравлический пресс.</p></div>
          <div class="card"><h3>Слоумо</h3><p>Кинематографичная камера включается автоматически на сильном ударе.</p></div>
